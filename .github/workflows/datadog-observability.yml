name: "🐕 Observabilidade Datadog"
run-name: "🐕 Instalar ou atualizar Datadog no EKS"

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: datadog-observability-development
  cancel-in-progress: false

env:
  AWS_REGION: ${{ vars.AWS_REGION || 'us-east-1' }}
  DD_SITE: ${{ vars.DD_SITE || 'datadoghq.com' }}
  DATADOG_CHART_VERSION: "3.239.0"
  DATADOG_NAMESPACE: datadog
  DATADOG_RELEASE_NAME: datadog
  SSM_KUBERNETES_CLUSTER_NAME: /oficina-mecanica/development/kubernetes/cluster_name

jobs:
  deploy-datadog:
    name: "☁️ Instalar ou atualizar observabilidade"
    if: vars.AWS_DEPLOY_ENABLED == 'true' && github.ref == 'refs/heads/develop'
    runs-on: ubuntu-latest
    environment:
      name: development

    steps:
      - name: "🛡️ Conferir habilitação do deploy AWS"
        env:
          DEPLOY_ENABLED: ${{ vars.AWS_DEPLOY_ENABLED }}
          DEPLOY_ENVIRONMENT: development
        run: |
          test "$DEPLOY_ENABLED" = true
          test "$GITHUB_REF" = refs/heads/develop
          test "$DEPLOY_ENVIRONMENT" = development

      - name: "📥 01 · Baixar código do repositório"
        uses: actions/checkout@v7

      - name: "🔑 02 · Configurar credenciais AWS"
        uses: aws-actions/configure-aws-credentials@v6
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: "☸️ 03 · Configurar kubectl"
        uses: azure/setup-kubectl@v4
        with:
          version: v1.33.4

      - name: "⛵ 04 · Configurar Helm"
        uses: azure/setup-helm@v4
        with:
          version: v3.18.6

      - name: "🛡️ 05 · Validar contrato da API key"
        env:
          DD_API_KEY: ${{ secrets.DD_API_KEY }}
        run: |
          set -euo pipefail

          if [ -z "${DD_API_KEY:-}" ]; then
            echo "::error::O GitHub Environment Secret DD_API_KEY não está cadastrado em development."
            exit 1
          fi

          echo "O secret DD_API_KEY está disponível para materialização segura no Kubernetes."

      - name: "🔎 06 · Localizar e validar cluster EKS"
        id: eks
        run: |
          set -euo pipefail

          cluster_name="$(aws ssm get-parameter \
            --name "$SSM_KUBERNETES_CLUSTER_NAME" \
            --query 'Parameter.Value' \
            --output text)"

          if [ -z "$cluster_name" ] || [ "$cluster_name" = "None" ]; then
            echo "::error::O contrato SSM não retornou um nome de cluster EKS válido."
            exit 1
          fi

          cluster_status="$(aws eks describe-cluster \
            --name "$cluster_name" \
            --query 'cluster.status' \
            --output text)"

          if [ "$cluster_status" != "ACTIVE" ]; then
            echo "::error::O cluster EKS $cluster_name não está ACTIVE. Status atual: $cluster_status."
            exit 1
          fi

          echo "cluster_name=$cluster_name" >> "$GITHUB_OUTPUT"
          echo "Cluster EKS $cluster_name está ACTIVE."

      - name: "🔗 07 · Configurar acesso ao EKS"
        env:
          CLUSTER_NAME: ${{ steps.eks.outputs.cluster_name }}
        run: |
          set -euo pipefail

          aws eks update-kubeconfig \
            --region "$AWS_REGION" \
            --name "$CLUSTER_NAME"

      - name: "🩺 08 · Validar conectividade com Kubernetes"
        run: |
          set -euo pipefail

          kubectl get --raw='/readyz' >/dev/null
          echo "A API do Kubernetes está acessível."

      - name: "🛡️ 09 · Validar autorizações Kubernetes"
        run: |
          set -euo pipefail

          assert_allowed() {
            local resource="$1"
            local namespace="${2:-}"
            local allowed

            if [ -n "$namespace" ]; then
              allowed="$(kubectl auth can-i create "$resource" --namespace "$namespace")"
            else
              allowed="$(kubectl auth can-i create "$resource")"
            fi

            if [ "$allowed" != "yes" ]; then
              if [ -n "$namespace" ]; then
                echo "::error::A identidade Kubernetes não pode criar $resource no namespace $namespace."
              else
                echo "::error::A identidade Kubernetes não pode criar $resource."
              fi
              exit 1
            fi
          }

          assert_allowed namespaces
          assert_allowed secrets "$DATADOG_NAMESPACE"
          assert_allowed clusterroles
          assert_allowed clusterrolebindings

          echo "As autorizações Kubernetes mínimas foram confirmadas."

      - name: "📦 10 · Criar namespace Datadog"
        run: |
          set -euo pipefail

          kubectl create namespace "$DATADOG_NAMESPACE" \
            --dry-run=client \
            --output yaml \
            | kubectl apply -f -

      - name: "🔐 11 · Criar ou atualizar secret Datadog"
        env:
          DD_API_KEY: ${{ secrets.DD_API_KEY }}
        run: |
          set -euo pipefail

          kubectl create secret generic datadog-secret \
            --namespace "$DATADOG_NAMESPACE" \
            --from-literal="api-key=$DD_API_KEY" \
            --dry-run=client \
            --output yaml \
            | kubectl apply -f -

          echo "O secret datadog-secret foi materializado sem exibir seu conteúdo."

      - name: "🗂️ 12 · Configurar repositório Helm do Datadog"
        run: |
          set -euo pipefail

          helm repo add datadog https://helm.datadoghq.com --force-update
          helm repo update datadog

      - name: "🧪 13 · Renderizar chart Datadog"
        env:
          CLUSTER_NAME: ${{ steps.eks.outputs.cluster_name }}
        run: |
          set -euo pipefail

          helm template "$DATADOG_RELEASE_NAME" datadog/datadog \
            --namespace "$DATADOG_NAMESPACE" \
            --version "$DATADOG_CHART_VERSION" \
            --values observability/datadog/values.yaml \
            --set-string "datadog.clusterName=$CLUSTER_NAME" \
            --set-string "datadog.site=$DD_SITE" \
            > "$RUNNER_TEMP/datadog-rendered.yaml"

          echo "Chart Datadog renderizado com sucesso."

      - name: "🛟 Recuperar atualização Datadog interrompida"
        run: |
          node <<'RECUPERAR_HELM'
          const cp = require('node:child_process');
          function revisaoRecuperavel(historico, agora, chart) {
            if (!Array.isArray(historico) || !historico.length) throw Error('Histórico Helm inválido.');
            const ordenado = [...historico].sort((a, b) => Number(a.revision) - Number(b.revision));
            const atual = ordenado.at(-1);
            if (!['pending-upgrade', 'pending-rollback', 'pending-install'].includes(atual.status)) return null;
            if (!['pending-upgrade', 'pending-rollback'].includes(atual.status)) throw Error('Instalação inicial pendente exige investigação.');
            const inicio = Date.parse(atual.updated);
            if (!Number.isFinite(inicio) || agora - inicio < 15 * 60 * 1000) throw Error('Operação recente ou sem data válida; não recuperar automaticamente.');
            if (atual.chart !== chart) throw Error('Chart pendente diferente do previsto.');
            const anterior = ordenado.filter(r => Number(r.revision) < Number(atual.revision) && ['deployed', 'superseded'].includes(r.status) && r.chart === chart).at(-1);
            if (!anterior || !Number.isInteger(Number(anterior.revision)) || Number(anterior.revision) < 1) throw Error('Nenhuma revisão anterior válida do mesmo chart.');
            return Number(anterior.revision);
          }
          if (require.main === module) {
            const release = process.env.DATADOG_RELEASE_NAME;
            const namespace = process.env.DATADOG_NAMESPACE;
            if (release !== 'datadog' || namespace !== 'datadog') throw Error('Recuperação restrita ao Datadog.');
            const helm = (...args) => cp.execFileSync('helm', args, {encoding: 'utf8'});
            const releases = JSON.parse(helm('list', '--all', '--namespace', namespace, '--output', 'json'));
            if (releases.some(r => r.name === release)) {
              const historico = JSON.parse(helm('history', release, '--namespace', namespace, '--max', '50', '--output', 'json'));
              const revisao = revisaoRecuperavel(historico, Date.now(), 'datadog-' + process.env.DATADOG_CHART_VERSION);
              if (revisao !== null) {
                cp.execFileSync('kubectl', ['wait', '--for=condition=Ready', 'nodes', '--all', '--timeout=10m'], {stdio: 'inherit'});
                console.log('Recuperando atualização interrompida do Datadog para revisão anterior válida: ' + revisao);
                cp.execFileSync('helm', ['rollback', release, String(revisao), '--namespace', namespace, '--wait', '--timeout', '10m'], {stdio: 'inherit'});
              }
            }
          }
          module.exports = { revisaoRecuperavel };
          RECUPERAR_HELM

      - name: "🚀 14 · Instalar ou atualizar Datadog"
        env:
          CLUSTER_NAME: ${{ steps.eks.outputs.cluster_name }}
        run: |
          set -euo pipefail

          helm upgrade --install "$DATADOG_RELEASE_NAME" datadog/datadog \
            --namespace "$DATADOG_NAMESPACE" \
            --version "$DATADOG_CHART_VERSION" \
            --values observability/datadog/values.yaml \
            --set-string "datadog.clusterName=$CLUSTER_NAME" \
            --set-string "datadog.site=$DD_SITE" \
            --atomic \
            --wait \
            --timeout 10m

      - name: "⏳ 15 · Aguardar Agent e Cluster Agent"
        run: |
          set -euo pipefail

          kubectl rollout status daemonset/datadog \
            --namespace "$DATADOG_NAMESPACE" \
            --timeout=10m

          kubectl rollout status deployment/datadog-cluster-agent \
            --namespace "$DATADOG_NAMESPACE" \
            --timeout=10m

      - name: "🧬 16 · Recuperar instrumentação dos serviços existentes"
        run: |
          node <<'RECUPERAR_INSTRUMENTACAO'
          const cp = require('node:child_process');
          const servicos = [
            ['oficina-mecanica', 'oficina-mecanica-api'],
            ['oficina-mecanica-execucao', 'oficina-mecanica-execucao'],
            ['oficina-mecanica-orcamento-pagamento', 'oficina-mecanica-orcamento-pagamento']
          ];
          const executar = (...args) => cp.execFileSync('kubectl', args, { encoding: 'utf8', stdio: ['ignore', 'pipe', 'pipe'] });
          function instrumentado(pod) {
            return pod.spec?.initContainers?.some(item => item.name === 'datadog-lib-dotnet-init') === true;
          }
          function requerRecuperacao(deployment, pods) {
            const modelo = deployment.spec?.template?.metadata;
            if (modelo?.labels?.['admission.datadoghq.com/enabled'] !== 'true'
              || modelo?.annotations?.['admission.datadoghq.com/dotnet-lib.version'] !== '3.50.0')
              throw Error('Instrumentação do Deployment diverge do contrato .NET aprovado.');
            const ativos = pods.filter(pod => !pod.metadata?.deletionTimestamp);
            return ativos.some(pod => !instrumentado(pod));
          }
          function main() {
            for (const [namespace, nome] of servicos) {
              const texto = executar('get', 'deployment', nome, '-n', namespace, '--ignore-not-found', '-o', 'json');
              if (!texto.trim()) continue; // Primeira subida da plataforma precede os serviços.
              const deployment = JSON.parse(texto);
              if (deployment.spec.replicas === 0) continue;
              const labels = Object.entries(deployment.spec.selector.matchLabels).map(([chave, valor]) => `${chave}=${valor}`).join(',');
              const listar = () => JSON.parse(executar('get', 'pods', '-n', namespace, '-l', labels, '-o', 'json')).items;
              if (requerRecuperacao(deployment, listar())) {
                executar('rollout', 'restart', `deployment/${nome}`, '-n', namespace);
                console.log(`${nome}: Pods sem biblioteca .NET encontrados; recuperação pela esteira solicitada.`);
              }
              executar('rollout', 'status', `deployment/${nome}`, '-n', namespace, '--timeout=600s');
              const atuais = listar().filter(pod => !pod.metadata?.deletionTimestamp);
              if (!atuais.length || atuais.some(pod => !instrumentado(pod)))
                throw Error(`${nome}: biblioteca .NET não confirmada após rollout.`);
              console.log(`${nome}: biblioteca .NET presente nos Pods ativos; ingestão deve ser validada no Datadog.`);
            }
          }
          if (!module.parent) main();
          module.exports = { instrumentado, requerRecuperacao };
          RECUPERAR_INSTRUMENTACAO

      - name: "📊 17 · Exibir status dos workloads Datadog"
        if: always()
        run: |
          kubectl get daemonsets,deployments,pods \
            --namespace "$DATADOG_NAMESPACE" \
            --output wide
