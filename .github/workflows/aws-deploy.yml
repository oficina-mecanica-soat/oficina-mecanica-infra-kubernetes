name: "☁️ AWS Deploy"
run-name: "☁️ Executar deploy AWS do Kubernetes em ${{ inputs.environment_name }}"

on:
  workflow_call:
    inputs:
      environment_name:
        description: "GitHub Environment used by this deploy."
        required: true
        type: string
    outputs:
      terraform_action:
        description: "Resolved Terraform action: apply or destroy."
        value: ${{ jobs.resolve_action.outputs.terraform_action }}

env:
  TF_WORKING_DIRECTORY: infra/terraform/environments/dev
  TERRAFORM_VERSION: "1.15.8"
  SSM_VPC_PREFIX: /oficina-mecanica/development/vpc
  SSM_VPC_STATUS_PARAMETER: /oficina-mecanica/development/status/vpc
  SSM_KUBERNETES_PREFIX: /oficina-mecanica/development/kubernetes
  SSM_KUBERNETES_STATUS_PARAMETER: /oficina-mecanica/development/status/kubernetes

jobs:
  resolve_action:
    name: "🔎 01 · Resolver ação do Terraform"
    runs-on: ubuntu-latest
    environment:
      name: ${{ inputs.environment_name }}
    outputs:
      terraform_action: ${{ steps.resolve_terraform_action.outputs.terraform_action }}

    steps:
      - name: "📥 01 · Baixar código do repositório"
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: "🛡️ Conferir habilitação do deploy AWS"
        env:
          DEPLOY_ENABLED: ${{ vars.AWS_DEPLOY_ENABLED }}
          DEPLOY_ENVIRONMENT: ${{ inputs.environment_name }}
        run: |
          test "$DEPLOY_ENABLED" = true
          test "$GITHUB_REF" = refs/heads/develop
          test "$DEPLOY_ENVIRONMENT" = development

      - name: "🚦 02 · Ler terraform-action.env e validar troca segura de destroy"
        id: resolve_terraform_action
        env:
          GITHUB_BEFORE: ${{ github.event.before }}
          GITHUB_AFTER: ${{ github.sha }}
        run: |
          control_file="$TF_WORKING_DIRECTORY/terraform-action.env"
          terraform_action="apply"

          if [ -f "$control_file" ]; then
            configured_action="$(grep -E '^[[:space:]]*TERRAFORM_ACTION[[:space:]]*=' "$control_file" | tail -n 1 | cut -d '=' -f 2- | tr -d '\r' | sed 's/^[[:space:]]*//;s/[[:space:]]*$//' || true)"

            if [ -n "$configured_action" ]; then
              terraform_action="$configured_action"
            fi
          fi

          case "$terraform_action" in
            apply|destroy)
              ;;
            *)
              echo "::error::Invalid TERRAFORM_ACTION '$terraform_action'. Use 'apply' or 'destroy'."
              exit 1
              ;;
          esac

          if [ "$terraform_action" = "destroy" ]; then
            destroy_control_changed="false"

            if [ -z "$GITHUB_BEFORE" ] || [ "$GITHUB_BEFORE" = "0000000000000000000000000000000000000000" ]; then
              destroy_control_changed="true"
            elif git diff --name-only "$GITHUB_BEFORE" "$GITHUB_AFTER" -- "$control_file" | grep -qx "$control_file"; then
              destroy_control_changed="true"
            fi

            if [ "$destroy_control_changed" != "true" ]; then
              echo "::error::TERRAFORM_ACTION=destroy is present but terraform-action.env was not changed in this push. Change it back to apply or open a dedicated destroy PR."
              exit 1
            fi

            echo "::warning::TERRAFORM_ACTION=destroy detected. This run will destroy AWS resources managed by Terraform."
          fi

          if [ "$terraform_action" = "apply" ]; then
            echo "::notice::>>> ACAO DECIDIDA: APPLY (criar/atualizar recursos AWS) <<<"
          else
            echo "::notice::>>> ACAO DECIDIDA: DESTROY (destruir recursos AWS) <<<"
          fi

          echo "terraform_action=$terraform_action" >> "$GITHUB_OUTPUT"

  prepare_and_plan:
    name: "📋 02 · Preparar variáveis e gerar plano do Terraform"
    needs: resolve_action
    runs-on: ubuntu-latest
    environment:
      name: ${{ inputs.environment_name }}
    outputs:
      cluster_name_before_destroy: ${{ steps.capture_destroy_context.outputs.cluster_name_before_destroy }}
      ecr_repository_name_before_destroy: ${{ steps.capture_destroy_context.outputs.ecr_repository_name_before_destroy }}
      execucao_ecr_repository_name_before_destroy: ${{ steps.capture_destroy_context.outputs.execucao_ecr_repository_name_before_destroy }}
      orcamento_pagamento_ecr_repository_name_before_destroy: ${{ steps.capture_destroy_context.outputs.orcamento_pagamento_ecr_repository_name_before_destroy }}
    env:
      AWS_REGION: ${{ vars.AWS_REGION || 'us-east-1' }}
      EKS_CLUSTER_ROLE_NAME: ${{ vars.EKS_CLUSTER_ROLE_NAME || 'LabRole' }}
      EKS_NODE_ROLE_NAME: ${{ vars.EKS_NODE_ROLE_NAME || 'LabRole' }}
      TERRAFORM_ACTION: ${{ needs.resolve_action.outputs.terraform_action }}

    steps:
      - name: "📥 01 · Baixar código do repositório"
        uses: actions/checkout@v7

      - name: "🔑 02 · Configurar credenciais AWS"
        uses: aws-actions/configure-aws-credentials@v6
        id: aws_credentials
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: "🛠️ 03 · Instalar Terraform"
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}
          terraform_wrapper: false

      - name: "🚦 04 · Validar dependência da VPC"
        run: |
          if [ "$TERRAFORM_ACTION" = "destroy" ]; then
            echo "Skipping VPC dependency validation because this run will destroy Kubernetes resources."
            exit 0
          fi

          vpc_status="$(aws ssm get-parameter --name "$SSM_VPC_STATUS_PARAMETER" --query 'Parameter.Value' --output text)"
          if [ "$vpc_status" != "ready" ]; then
            echo "::error::VPC dependency is not ready. Expected ready, got $vpc_status."
            exit 1
          fi

          vpc_id="$(aws ssm get-parameter --name "$SSM_VPC_PREFIX/vpc_id" --query 'Parameter.Value' --output text)"
          private_subnet_ids="$(aws ssm get-parameter --name "$SSM_VPC_PREFIX/private_subnet_ids" --query 'Parameter.Value' --output text)"

          if [ -z "$vpc_id" ] || [ -z "$private_subnet_ids" ]; then
            echo "::error::VPC SSM outputs are incomplete."
            exit 1
          fi

          echo "VPC dependency validated through SSM."

      - name: "📦 05 · Restaurar cache do state Terraform"
        uses: actions/cache/restore@v6
        with:
          path: |
            ${{ env.TF_WORKING_DIRECTORY }}/terraform.tfstate
            ${{ env.TF_WORKING_DIRECTORY }}/terraform.tfstate.backup
          key: tfstate-kubernetes-${{ steps.aws_credentials.outputs.aws-account-id }}-${{ inputs.environment_name }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            tfstate-kubernetes-${{ steps.aws_credentials.outputs.aws-account-id }}-${{ inputs.environment_name }}-

      - name: "📝 06 · Escrever variáveis do Terraform"
        run: |
          cat > "$TF_WORKING_DIRECTORY/zz_ci.auto.tfvars.json" <<JSON
          {
            "aws_region": "$AWS_REGION",
            "eks_cluster_role_name": "$EKS_CLUSTER_ROLE_NAME",
            "eks_node_role_name": "$EKS_NODE_ROLE_NAME"
          }
          JSON

      - name: "🛡️ Validar state da conta AWS atual"
        run: node .github/scripts/bootstrap-account-state.cjs

      - name: "🛡️ Preparar configuração exclusiva de destroy"
        if: env.TERRAFORM_ACTION == 'destroy'
        run: node .github/scripts/prepare-destroy.cjs

      - name: "🚀 07 · Inicializar Terraform"
        run: terraform -chdir="$TF_WORKING_DIRECTORY" init -input=false

      - name: "🔍 08 · Validar configuração Terraform"
        run: terraform -chdir="$TF_WORKING_DIRECTORY" validate

      - name: "🛡️ 09 · Capturar Kubernetes atual antes do destroy"
        id: capture_destroy_context
        if: env.TERRAFORM_ACTION == 'destroy'
        run: |
          set -euo pipefail

          assert_resource_present_or_absent() {
            local resource_label="$1"
            shift
            local command_output

            if command_output="$("$@" 2>&1)"; then
              echo "${resource_label} exists and will be validated after destroy."
              return 0
            else
              local command_status=$?
              case "$command_output" in
                *ResourceNotFoundException*|*RepositoryNotFoundException*)
                  echo "::warning::${resource_label} is already absent. Treating this as partial destroy recovery."
                  return 10
                  ;;
                *)
                  echo "::error::Could not inspect ${resource_label} before destroy. The error is not an absence confirmation."
                  echo "$command_output"
                  return "$command_status"
                  ;;
              esac
            fi
          }

          cluster_name="$(terraform -chdir="$TF_WORKING_DIRECTORY" output -json | jq -r '.eks_cluster_name.value // empty')"
          ecr_repository_name="$(terraform -chdir="$TF_WORKING_DIRECTORY" output -json | jq -r '.ecr_repository_name.value // empty')"
          execucao_ecr_repository_name="$(terraform -chdir="$TF_WORKING_DIRECTORY" output -json | jq -r '.execucao_ecr_repository_name.value // empty')"
          orcamento_pagamento_ecr_repository_name="$(terraform -chdir="$TF_WORKING_DIRECTORY" output -json | jq -r '.orcamento_pagamento_ecr_repository_name.value // empty')"

          if [ -z "$cluster_name" ]; then
            echo "::warning::EKS output is absent from Terraform state. Continuing as partial destroy recovery."
          else
            if assert_resource_present_or_absent "EKS cluster $cluster_name" aws eks describe-cluster --name "$cluster_name" --query 'cluster.name' --output text; then
              :
            else
              inspection_status=$?
              if [ "$inspection_status" -ne 10 ]; then
                exit "$inspection_status"
              fi
            fi
          fi

          if [ -z "$ecr_repository_name" ]; then
            echo "::warning::ECR output is absent from Terraform state. Continuing as partial destroy recovery."
          else
            if assert_resource_present_or_absent "ECR repository $ecr_repository_name" aws ecr describe-repositories --repository-names "$ecr_repository_name" --query 'repositories[0].repositoryName' --output text; then
              :
            else
              inspection_status=$?
              if [ "$inspection_status" -ne 10 ]; then
                exit "$inspection_status"
              fi
            fi
          fi

          if [ -z "$execucao_ecr_repository_name" ]; then
            echo "::warning::ECR output is absent from Terraform state. Continuing as partial destroy recovery."
          else
            if assert_resource_present_or_absent "ECR repository $execucao_ecr_repository_name" aws ecr describe-repositories --repository-names "$execucao_ecr_repository_name" --query 'repositories[0].repositoryName' --output text; then
              :
            else
              inspection_status=$?
              if [ "$inspection_status" -ne 10 ]; then
                exit "$inspection_status"
              fi
            fi
          fi

          if [ -z "$orcamento_pagamento_ecr_repository_name" ]; then
            echo "::warning::ECR output is absent from Terraform state. Continuing as partial destroy recovery."
          else
            if assert_resource_present_or_absent "ECR repository $orcamento_pagamento_ecr_repository_name" aws ecr describe-repositories --repository-names "$orcamento_pagamento_ecr_repository_name" --query 'repositories[0].repositoryName' --output text; then
              :
            else
              inspection_status=$?
              if [ "$inspection_status" -ne 10 ]; then
                exit "$inspection_status"
              fi
            fi
          fi

          echo "cluster_name_before_destroy=$cluster_name" >> "$GITHUB_OUTPUT"
          echo "ecr_repository_name_before_destroy=$ecr_repository_name" >> "$GITHUB_OUTPUT"
          echo "execucao_ecr_repository_name_before_destroy=$execucao_ecr_repository_name" >> "$GITHUB_OUTPUT"
          echo "orcamento_pagamento_ecr_repository_name_before_destroy=$orcamento_pagamento_ecr_repository_name" >> "$GITHUB_OUTPUT"
          echo "Kubernetes destroy context captured when available."

      - name: "📐 10 · Gerar plano do Terraform (apply)"
        if: env.TERRAFORM_ACTION == 'apply'
        run: terraform -chdir="$TF_WORKING_DIRECTORY" plan -input=false -out=tfplan

      - name: "📐 10 · Gerar plano do Terraform (destroy)"
        if: env.TERRAFORM_ACTION == 'destroy'
        run: terraform -chdir="$TF_WORKING_DIRECTORY" plan -destroy -input=false -out=tfplan

      - name: "⬆️ 11 · Publicar plano do Terraform como artefato"
        uses: actions/upload-artifact@v7
        with:
          name: tfplan-kubernetes-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ env.TF_WORKING_DIRECTORY }}/tfplan
          retention-days: 1
          if-no-files-found: error

  apply_or_destroy:
    name: "☁️ 03 · Aplicar ou destruir Kubernetes"
    needs:
      - resolve_action
      - prepare_and_plan
    runs-on: ubuntu-latest
    environment:
      name: ${{ inputs.environment_name }}
    env:
      AWS_REGION: ${{ vars.AWS_REGION || 'us-east-1' }}
      TERRAFORM_ACTION: ${{ needs.resolve_action.outputs.terraform_action }}
      CLUSTER_NAME_BEFORE_DESTROY: ${{ needs.prepare_and_plan.outputs.cluster_name_before_destroy }}
      ECR_REPOSITORY_NAME_BEFORE_DESTROY: ${{ needs.prepare_and_plan.outputs.ecr_repository_name_before_destroy }}
      EXECUCAO_ECR_REPOSITORY_NAME_BEFORE_DESTROY: ${{ needs.prepare_and_plan.outputs.execucao_ecr_repository_name_before_destroy }}
      ORCAMENTO_PAGAMENTO_ECR_REPOSITORY_NAME_BEFORE_DESTROY: ${{ needs.prepare_and_plan.outputs.orcamento_pagamento_ecr_repository_name_before_destroy }}

    steps:
      - name: "📥 01 · Baixar código do repositório"
        uses: actions/checkout@v7

      - name: "🔑 02 · Configurar credenciais AWS"
        uses: aws-actions/configure-aws-credentials@v6
        id: aws_credentials
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: "🛠️ 03 · Instalar Terraform"
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}
          terraform_wrapper: false

      - name: "📦 04 · Restaurar cache do state Terraform"
        uses: actions/cache/restore@v6
        with:
          path: |
            ${{ env.TF_WORKING_DIRECTORY }}/terraform.tfstate
            ${{ env.TF_WORKING_DIRECTORY }}/terraform.tfstate.backup
          key: tfstate-kubernetes-${{ steps.aws_credentials.outputs.aws-account-id }}-${{ inputs.environment_name }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            tfstate-kubernetes-${{ steps.aws_credentials.outputs.aws-account-id }}-${{ inputs.environment_name }}-

      - name: "🛡️ Validar state da conta AWS atual"
        run: node .github/scripts/bootstrap-account-state.cjs

      - name: "🛡️ Preparar configuração exclusiva de destroy"
        if: env.TERRAFORM_ACTION == 'destroy'
        run: node .github/scripts/prepare-destroy.cjs

      - name: "🚀 05 · Inicializar Terraform"
        run: terraform -chdir="$TF_WORKING_DIRECTORY" init -input=false

      - name: "⬇️ 06 · Baixar plano do Terraform publicado"
        uses: actions/download-artifact@v8
        with:
          name: tfplan-kubernetes-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ env.TF_WORKING_DIRECTORY }}

      - name: "🛡️ Validar plano exclusivo de destroy"
        if: env.TERRAFORM_ACTION == 'destroy'
        run: node .github/scripts/prepare-destroy.cjs verify-plan

      - name: "✅ 07 · Aplicar plano do Terraform"
        run: terraform -chdir="$TF_WORKING_DIRECTORY" apply -input=false -auto-approve tfplan

      - name: "🔎 Confirmar state sem recursos gerenciados"
        if: env.TERRAFORM_ACTION == 'destroy'
        run: node .github/scripts/prepare-destroy.cjs verify-state

      - name: "💾 08 · Salvar cache final do state Terraform"
        if: always()
        uses: actions/cache/save@v6
        with:
          path: |
            ${{ env.TF_WORKING_DIRECTORY }}/terraform.tfstate
            ${{ env.TF_WORKING_DIRECTORY }}/terraform.tfstate.backup
          key: tfstate-kubernetes-${{ steps.aws_credentials.outputs.aws-account-id }}-${{ inputs.environment_name }}-${{ github.run_id }}-${{ github.run_attempt }}

      - name: "🛡️ Ajustar IMDSv2 da identidade acadêmica nos nodes atuais"
        if: env.TERRAFORM_ACTION == 'apply'
        run: |
          node <<'CONFIGURAR_IMDS_ACADEMICO'
          const cp = require('node:child_process');
          const consultar = (...args) => JSON.parse(cp.execFileSync('aws', [...args, '--output', 'json'], { encoding: 'utf8', stdio: ['ignore', 'pipe', 'pipe'] }));
          function validarGrupo(grupo, conta) {
            if (grupo.status !== 'ACTIVE' || grupo.nodeRole !== `arn:aws:iam::${conta}:role/LabRole`)
              throw new Error('Exceção IMDS aceita somente para node group ACTIVE com LabRole da conta atual.');
            const nomes = grupo.resources?.autoScalingGroups?.map(item => item.name);
            if (!nomes?.length || nomes.some(nome => !nome)) throw new Error('Auto Scaling Groups do node group ausentes.');
            return nomes;
          }
          function validarInstancias(grupos, nomes, instancias, cluster) {
            if (grupos.length !== nomes.length || grupos.some(grupo => !nomes.includes(grupo.AutoScalingGroupName)))
              throw new Error('Inventário de Auto Scaling Groups divergente.');
            const ids = grupos.flatMap(grupo => grupo.Instances || []).map(item => item.InstanceId);
            if (!ids.length || new Set(ids).size !== ids.length || instancias.length !== ids.length
              || new Set(instancias.map(item => item.InstanceId)).size !== ids.length
              || instancias.some(item => !ids.includes(item.InstanceId) || item.State?.Name !== 'running'
                || !item.Tags?.some(tag => tag.Key === 'eks:cluster-name' && tag.Value === cluster)
                || item.MetadataOptions?.HttpEndpoint !== 'enabled'))
              throw new Error('Inventário dos nodes incompleto, incompatível ou fora do cluster.');
            return ids;
          }
          function inventarioPronto(grupos, nomes, esperado) {
            if (!Number.isSafeInteger(esperado) || esperado < 1) throw Error('Quantidade desejada de nodes inválida.');
            if (grupos.length !== nomes.length || grupos.some(grupo => !nomes.includes(grupo.AutoScalingGroupName)))
              throw Error('Inventário de Auto Scaling Groups divergente.');
            const instancias = grupos.flatMap(grupo => grupo.Instances || []);
            return instancias.length === esperado && new Set(instancias.map(item => item.InstanceId)).size === esperado
              && instancias.every(item => item.InstanceId && item.LifecycleState === 'InService');
          }
          function conferir(opcoes) {
            return opcoes?.State === 'applied' && opcoes.HttpEndpoint === 'enabled'
              && opcoes.HttpTokens === 'required' && opcoes.HttpPutResponseHopLimit === 2;
          }
          function gerenciamentoPronto(ids, informacoes) {
            return ids.length > 0 && ids.every(id => informacoes.some(item => item.InstanceId === id && item.PingStatus === 'Online'));
          }
          async function recuperarInicializacao(ids) {
            // O SSM Agent pode aguardar até 30 minutos para renovar credenciais após falha (AWS Academy).
            const tentativasGerenciamento = 210; // 35 minutos, incluindo registro e propagação.
            for (let tentativa = 0; tentativa < tentativasGerenciamento; tentativa++) {
              const informacoes = consultar('ssm', 'describe-instance-information', '--filters',
                JSON.stringify([{ Key: 'InstanceIds', Values: ids }])).InstanceInformationList;
              if (gerenciamentoPronto(ids, informacoes)) break;
              if (tentativa === tentativasGerenciamento - 1) throw Error('Gerenciamento dos nós indisponível após 35 minutos; recuperação não executada.');
              await new Promise(resolve => setTimeout(resolve, 10000));
            }
            const comandos = ['set -eu',
              'if systemctl is-failed --quiet nodeadm-config.service; then',
              '  systemctl reset-failed nodeadm-config.service nodeadm-run.service',
              '  systemctl start nodeadm-config.service',
              '  systemctl start nodeadm-run.service',
              'fi',
              'systemctl is-active --quiet kubelet.service'];
            const comando = consultar('ssm', 'send-command', '--document-name', 'AWS-RunShellScript',
              '--instance-ids', ...ids, '--timeout-seconds', '900',
              '--parameters', JSON.stringify({ commands: comandos, executionTimeout: ['900'] }),
              '--comment', 'Recuperar inicialização EKS interrompida pelo encerramento Academy').Command.CommandId;
            for (let tentativa = 0; tentativa < 100; tentativa++) {
              const resultados = consultar('ssm', 'list-command-invocations', '--command-id', comando).CommandInvocations;
              if (resultados.some(item => ['Failed', 'Cancelled', 'TimedOut'].includes(item.Status)))
                throw Error('Inicialização dos nós não recuperada; conferir execução SSM pela esteira.');
              if (resultados.length === ids.length && resultados.every(item => ids.includes(item.InstanceId) && item.Status === 'Success')) {
                console.log('Kubelet ativo nos nós do grupo; somente inicializações com falha foram retomadas.');
                return;
              }
              await new Promise(resolve => setTimeout(resolve, 10000));
            }
            throw Error('Prazo de recuperação da inicialização EKS excedido.');
          }
          async function main() {
            const tf = nome => cp.execFileSync('terraform', [`-chdir=${process.env.TF_WORKING_DIRECTORY}`, 'output', '-raw', nome], { encoding: 'utf8' }).trim();
            const cluster = tf('eks_cluster_name');
            const grupo = consultar('eks', 'describe-nodegroup', '--cluster-name', cluster, '--nodegroup-name', tf('eks_node_group_name')).nodegroup;
            const nomes = validarGrupo(grupo, consultar('sts', 'get-caller-identity').Account);
            let grupos;
            for (let tentativa = 0; tentativa < 36; tentativa++) {
              grupos = consultar('autoscaling', 'describe-auto-scaling-groups', '--auto-scaling-group-names', ...nomes).AutoScalingGroups;
              if (inventarioPronto(grupos, nomes, grupo.scalingConfig?.desiredSize)) break;
              if (tentativa === 35) throw Error('Expansão dos nodes não confirmada no prazo; identidade acadêmica pendente.');
              await new Promise(resolve => setTimeout(resolve, 5000));
            }
            const ids = grupos.flatMap(item => item.Instances || []).map(item => item.InstanceId);
            const listar = () => consultar('ec2', 'describe-instances', '--instance-ids', ...ids).Reservations.flatMap(item => item.Instances);
            validarInstancias(grupos, nomes, listar(), cluster);
            for (const id of ids) consultar('ec2', 'modify-instance-metadata-options', '--instance-id', id,
              '--http-endpoint', 'enabled', '--http-tokens', 'required', '--http-put-response-hop-limit', '2');
            for (let tentativa = 0; tentativa < 30; tentativa++) {
              const atuais = listar();
              validarInstancias(grupos, nomes, atuais, cluster);
              if (atuais.every(item => conferir(item.MetadataOptions))) {
                console.log(`IMDSv2 obrigatório e hop limit 2 confirmados em ${ids.length} node(s) do grupo acadêmico.`);
                await recuperarInicializacao(ids);
                return;
              }
              await new Promise(resolve => setTimeout(resolve, 2000));
            }
            throw new Error('Configuração IMDSv2 não foi confirmada no prazo.');
          }
          if (!module.parent) main().catch(error => { console.error(error.message); process.exitCode = 1; });
          module.exports = { validarGrupo, validarInstancias, inventarioPronto, conferir, gerenciamentoPronto };
          CONFIGURAR_IMDS_ACADEMICO

      - name: "🔎 09 · Validar Kubernetes real após apply"
        if: env.TERRAFORM_ACTION == 'apply'
        run: |
          set -euo pipefail

          cluster_name="$(terraform -chdir="$TF_WORKING_DIRECTORY" output -raw eks_cluster_name)"
          node_group_name="$(terraform -chdir="$TF_WORKING_DIRECTORY" output -raw eks_node_group_name)"
          ecr_repository_name="$(terraform -chdir="$TF_WORKING_DIRECTORY" output -raw ecr_repository_name)"

          cluster_status="$(aws eks describe-cluster --name "$cluster_name" --query 'cluster.status' --output text)"
          if [ "$cluster_status" != "ACTIVE" ]; then
            echo "::error::EKS cluster $cluster_name is not ACTIVE. Current status: $cluster_status"
            exit 1
          fi

          node_group_status="$(aws eks describe-nodegroup --cluster-name "$cluster_name" --nodegroup-name "$node_group_name" --query 'nodegroup.status' --output text)"
          if [ "$node_group_status" != "ACTIVE" ]; then
            echo "::error::EKS node group $node_group_name is not ACTIVE. Current status: $node_group_status"
            exit 1
          fi

          aws ecr describe-repositories --repository-names "$ecr_repository_name" --query 'repositories[0].repositoryUri' --output text

          execucao_ecr_repository_name="$(terraform -chdir="$TF_WORKING_DIRECTORY" output -raw execucao_ecr_repository_name)"
          execucao_ecr_repository_url="$(terraform -chdir="$TF_WORKING_DIRECTORY" output -raw execucao_ecr_repository_url)"
          actual_url="$(aws ecr describe-repositories --repository-names "$execucao_ecr_repository_name" --query 'repositories[0].repositoryUri' --output text)"
          test "$actual_url" = "$execucao_ecr_repository_url"

          orcamento_pagamento_ecr_repository_name="$(terraform -chdir="$TF_WORKING_DIRECTORY" output -raw orcamento_pagamento_ecr_repository_name)"
          orcamento_pagamento_ecr_repository_url="$(terraform -chdir="$TF_WORKING_DIRECTORY" output -raw orcamento_pagamento_ecr_repository_url)"
          actual_url="$(aws ecr describe-repositories --repository-names "$orcamento_pagamento_ecr_repository_name" --query 'repositories[0].repositoryUri' --output text)"
          test "$actual_url" = "$orcamento_pagamento_ecr_repository_url"
          test "$(aws ssm get-parameter --name "$SSM_KUBERNETES_PREFIX/execucao_ecr_repository_name" --query Parameter.Value --output text)" = "$execucao_ecr_repository_name"
          test "$(aws ssm get-parameter --name "$SSM_KUBERNETES_PREFIX/execucao_ecr_repository_url" --query Parameter.Value --output text)" = "$execucao_ecr_repository_url"
          test "$(aws ssm get-parameter --name "$SSM_KUBERNETES_PREFIX/orcamento_pagamento_ecr_repository_name" --query Parameter.Value --output text)" = "$orcamento_pagamento_ecr_repository_name"
          test "$(aws ssm get-parameter --name "$SSM_KUBERNETES_PREFIX/orcamento_pagamento_ecr_repository_url" --query Parameter.Value --output text)" = "$orcamento_pagamento_ecr_repository_url"

          ssm_cluster_name="$(aws ssm get-parameter --name "$SSM_KUBERNETES_PREFIX/cluster_name" --query 'Parameter.Value' --output text)"
          if [ "$ssm_cluster_name" != "$cluster_name" ]; then
            echo "::error::Kubernetes SSM cluster name differs from Terraform output. Terraform=$cluster_name SSM=$ssm_cluster_name"
            exit 1
          fi

          ssm_status="$(aws ssm get-parameter --name "$SSM_KUBERNETES_STATUS_PARAMETER" --query 'Parameter.Value' --output text)"
          if [ "$ssm_status" != "ready" ]; then
            echo "::error::Kubernetes SSM status differs from expected value. Expected=ready Current=$ssm_status"
            exit 1
          fi

          echo "Kubernetes infrastructure validated successfully in AWS and SSM."

      - name: "🔎 Validar ingressos privados e contratos dos serviços"
        if: env.TERRAFORM_ACTION == 'apply'
        run: |
          node <<'VALIDAR_INGRESSOS_PRIVADOS'
          function validarIngressos(contratos,conta,regiao,prefixo,consultar) {
            const portas={execucao:[30081,8081],orcamento_pagamento:[30082,8082]};
            if(!contratos||Object.keys(contratos).sort().join(',')!==Object.keys(portas).sort().join(','))throw Error('Contratos de ingresso incompletos.');
            for(const [servico,c]of Object.entries(contratos)) {
              if(c.node_port!==portas[servico][0]||c.listener_port!==portas[servico][1])throw Error('Portas contratuais divergentes.');
              const base='arn:aws:elasticloadbalancing:'+regiao+':'+conta+':';
              if(!c.listener_arn.startsWith(base+'listener/net/')||!c.target_group_arn.startsWith(base+'targetgroup/')||!c.nlb_arn.startsWith(base+'loadbalancer/net/'))throw Error('Ingresso pertence a outra conta, região ou tipo.');
              const lb=consultar('elbv2','describe-load-balancers','--load-balancer-arns',c.nlb_arn).LoadBalancers;
              if(!Array.isArray(lb)||lb.length!==1||lb[0].Scheme!=='internal'||lb[0].Type!=='network'||lb[0].LoadBalancerArn!==c.nlb_arn)throw Error('NLB não é o ingresso privado esperado.');
              const ls=consultar('elbv2','describe-listeners','--listener-arns',c.listener_arn).Listeners;
              if(!Array.isArray(ls)||ls.length!==1||ls[0].ListenerArn!==c.listener_arn||ls[0].LoadBalancerArn!==c.nlb_arn||ls[0].Port!==c.listener_port||ls[0].Protocol!=='TCP'||ls[0].DefaultActions?.length!==1||ls[0].DefaultActions[0].Type!=='forward'||ls[0].DefaultActions[0].TargetGroupArn!==c.target_group_arn)throw Error('Listener não aponta ao owner esperado.');
              const ts=consultar('elbv2','describe-target-groups','--target-group-arns',c.target_group_arn).TargetGroups;
              if(!Array.isArray(ts)||ts.length!==1||ts[0].TargetGroupArn!==c.target_group_arn||ts[0].Port!==c.node_port||ts[0].Protocol!=='TCP'||ts[0].TargetType!=='instance'||ts[0].VpcId!==lb[0].VpcId)throw Error('Target group diverge do NodePort ou da VPC.');
              for(const [sufixo,valor]of [['internal_node_port',String(c.node_port)],['internal_nlb_listener_arn',c.listener_arn]]) {
                const p=consultar('ssm','get-parameter','--name',prefixo+'/'+servico+'_'+sufixo).Parameter;
                if(p?.Type!=='String'||p.Value!==valor)throw Error('Contrato SSM diverge do ingresso real.');
              }
              const regras=consultar('ec2','describe-security-group-rules','--filters','Name=group-id,Values='+c.node_security_group_id).SecurityGroupRules;
              if(!Array.isArray(regras)||!regras.some(r=>r.IsEgress===false&&r.IpProtocol==='tcp'&&r.FromPort===c.node_port&&r.ToPort===c.node_port&&r.ReferencedGroupInfo?.GroupId===c.nlb_security_group_id))throw Error('Regra privada NLB para NodePort não confirmada.');
            }
          }
          // Execução no runner: somente consultas; falhas não equivalem a ausência.
          const cp=require('node:child_process');
          const run=(cmd,args)=>JSON.parse(cp.execFileSync(cmd,args,{encoding:'utf8',stdio:['ignore','pipe','pipe']}));
          const contratos=run('terraform',['-chdir='+process.env.TF_WORKING_DIRECTORY,'output','-json','microsservicos_private_ingress']);
          const conta=run('aws',['sts','get-caller-identity','--output','json']).Account;
          validarIngressos(contratos,conta,process.env.AWS_REGION,process.env.SSM_KUBERNETES_PREFIX,(...args)=>run('aws',[...args,'--region',process.env.AWS_REGION,'--output','json']));
          console.log('Ingressos privados e contratos confirmados; não comprova workload ou fluxo de negócio.');
          VALIDAR_INGRESSOS_PRIVADOS

      - name: "🔎 09 · Validar remoção real após destroy"
        if: env.TERRAFORM_ACTION == 'destroy'
        run: |
          set -euo pipefail

          assert_resource_absent() {
            local resource_label="$1"
            shift
            local command_output

            if command_output="$("$@" 2>&1)"; then
              echo "::error::${resource_label} still exists after destroy."
              return 1
            else
              local command_status=$?
              case "$command_output" in
                *ResourceNotFoundException*|*RepositoryNotFoundException*|*ParameterNotFound*|*"(LoadBalancerNotFound)"*|*"(TargetGroupNotFound)"*)
                  echo "${resource_label} is absent after destroy."
                  return 0
                  ;;
                *)
                  echo "::error::Could not confirm removal of ${resource_label}. The error is not an absence confirmation."
                  echo "$command_output"
                  return "$command_status"
                  ;;
              esac
            fi
          }

          if [ -z "$CLUSTER_NAME_BEFORE_DESTROY" ]; then
            echo "::warning::EKS output was absent before destroy; no cluster identifier is available for post-destroy verification."
          else
            assert_resource_absent "EKS cluster $CLUSTER_NAME_BEFORE_DESTROY" aws eks describe-cluster --name "$CLUSTER_NAME_BEFORE_DESTROY" --query 'cluster.name' --output text
          fi

          if [ -z "$ECR_REPOSITORY_NAME_BEFORE_DESTROY" ]; then
            echo "::warning::ECR output was absent before destroy; no repository identifier is available for post-destroy verification."
          else
            assert_resource_absent "ECR repository $ECR_REPOSITORY_NAME_BEFORE_DESTROY" aws ecr describe-repositories --repository-names "$ECR_REPOSITORY_NAME_BEFORE_DESTROY" --query 'repositories[0].repositoryName' --output text
          fi

          if [ -z "$EXECUCAO_ECR_REPOSITORY_NAME_BEFORE_DESTROY" ]; then
            echo "::warning::ECR output was absent before destroy; no repository identifier is available for post-destroy verification."
          else
            assert_resource_absent "ECR repository $EXECUCAO_ECR_REPOSITORY_NAME_BEFORE_DESTROY" aws ecr describe-repositories --repository-names "$EXECUCAO_ECR_REPOSITORY_NAME_BEFORE_DESTROY" --query 'repositories[0].repositoryName' --output text
          fi

          if [ -z "$ORCAMENTO_PAGAMENTO_ECR_REPOSITORY_NAME_BEFORE_DESTROY" ]; then
            echo "::warning::ECR output was absent before destroy; no repository identifier is available for post-destroy verification."
          else
            assert_resource_absent "ECR repository $ORCAMENTO_PAGAMENTO_ECR_REPOSITORY_NAME_BEFORE_DESTROY" aws ecr describe-repositories --repository-names "$ORCAMENTO_PAGAMENTO_ECR_REPOSITORY_NAME_BEFORE_DESTROY" --query 'repositories[0].repositoryName' --output text
          fi

          assert_resource_absent "Contrato SSM ECR Execução (nome)" aws ssm get-parameter --name "$SSM_KUBERNETES_PREFIX/execucao_ecr_repository_name" --query Parameter.Value --output text
          assert_resource_absent "Contrato SSM ECR Execução (URL)" aws ssm get-parameter --name "$SSM_KUBERNETES_PREFIX/execucao_ecr_repository_url" --query Parameter.Value --output text

          assert_resource_absent "Contrato SSM ECR Orçamento/Pagamento (nome)" aws ssm get-parameter --name "$SSM_KUBERNETES_PREFIX/orcamento_pagamento_ecr_repository_name" --query Parameter.Value --output text
          assert_resource_absent "Contrato SSM ECR Orçamento/Pagamento (URL)" aws ssm get-parameter --name "$SSM_KUBERNETES_PREFIX/orcamento_pagamento_ecr_repository_url" --query Parameter.Value --output text

          assert_resource_absent "Kubernetes status parameter $SSM_KUBERNETES_STATUS_PARAMETER" aws ssm get-parameter --name "$SSM_KUBERNETES_STATUS_PARAMETER" --query 'Parameter.Value' --output text

          assert_resource_absent "NLB privado" aws elbv2 describe-load-balancers --names oficina-mecanica-api-nlb-dev
          for target_group in oficina-execucao-tg-dev oficina-orcamento-tg-dev; do
            assert_resource_absent "Target group $target_group" aws elbv2 describe-target-groups --names "$target_group"
          done
          for owner in execucao orcamento_pagamento; do
            for suffix in internal_node_port internal_nlb_listener_arn; do
              assert_resource_absent "Contrato privado $owner/$suffix" aws ssm get-parameter --name "$SSM_KUBERNETES_PREFIX/${owner}_${suffix}"
            done
          done

          echo "Kubernetes resources removed and SSM status cleaned."
